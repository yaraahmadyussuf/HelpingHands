<!DOCTYPE html>
<html>
<head>
    <title>Help Requests</title>
<!-- connects the HTML to the CSS file-->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/requests.css') }}"
    >

</head>

<body>
<!-- page title-->

    <h1>Help Requests</h1>
<!-- short description of the page-->

    <p>Find people who need help.</p>

    <hr>
<!-- search form for finding help request-->

    <h3>Search</h3>

    <form>
<!-- input where the user can search with the word -->
        <input
            type="text"
            placeholder="Search requests..."
        >
<!-- button for submiting the search-->

        <button type="submit">Search</button>

    </form>

    <br>
<!-- dropdown menu for filtering the request by category-->
    <h3>Filter by Category</h3>

    <select>

        <option>All Categories</option>
        <option>Education</option>
        <option>Medical</option>
        <option>Food</option>
        <option>Housing</option>
        <option>Other</option>

    </select>

    <hr>

    <!-- Example request -->

    <div>

        <h2>Help with University Fees</h2>

        <p>
            I need help paying my university tuition.
        </p>

        <p>
            Category: Education
        </p>

        <p>
            Amount Needed: 10,000 EGP
        </p>
<!-- button that will later open the request detail-->
        <button>View Details</button>

    </div>

    <hr>

    <!-- Another example request -->

    <div>

        <h2>Medical Assistance</h2>

        <p>
            I need financial help for medical treatment.
        </p>

        <p>
            Category: Medical
        </p>

        <p>
            Amount Needed: 5,000 EGP
        </p>

        <button>View Details</button>

    </div>

</body>
</html>
