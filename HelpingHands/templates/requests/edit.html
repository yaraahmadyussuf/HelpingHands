<!DOCTYPE html>
<html>

<head>
    <title>Edit Help Request</title>

    <!-- Connect the HTML page to the CSS file -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/requests.css') }}"
    >
</head>

<body>

    <!-- Page title -->
    <h1>Edit Help Request</h1>

    <!-- Form that allows the user to edit the help request information -->
    <form method="POST">

        <!-- Input for editing the request title -->
        <label for="title">Title:</label>
        <br>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ request['title'] }}"
        >

        <br><br>

        <!-- Text area for editing the request description -->
        <label for="description">Description:</label>
        <br>

        <textarea
            id="description"
            name="description"
            rows="6"
        >{{ request['description'] }}</textarea>

        <br><br>

        <!-- Dropdown menu for editing the request category -->
        <label for="category">Category:</label>
        <br>

        <select id="category" name="category">

            <!-- Select Education if the current category is Education -->
            <option value="Education"
                {% if request['category'] == 'Education' %}selected{% endif %}>
                Education
            </option>

            <!-- Select Medical if the current category is Medical -->
            <option value="Medical"
                {% if request['category'] == 'Medical' %}selected{% endif %}>
                Medical
            </option>

            <!-- Select Food if the current category is Food -->
            <option value="Food"
                {% if request['category'] == 'Food' %}selected{% endif %}>
                Food
            </option>

            <!-- Select Housing if the current category is Housing -->
            <option value="Housing"
                {% if request['category'] == 'Housing' %}selected{% endif %}>
                Housing
            </option>

            <!-- Select Other if the current category is Other -->
            <option value="Other"
                {% if request['category'] == 'Other' %}selected{% endif %}>
                Other
            </option>

        </select>

        <br><br>

        <!-- Input for editing the amount of money needed -->
        <label for="amount_needed">Amount Needed:</label>
        <br>

        <input
            type="number"
            id="amount_needed"
            name="amount_needed"
            value="{{ request['amount_needed'] }}"
            min="0"
            step="0.01"
        >

        <br><br>

        <!-- Button for submitting the edited request -->
        <button type="submit">Save Changes</button>

    </form>

    <br>

    <!-- Link to cancel editing and return to the request details page -->
    <a href="{{ url_for('requests.request_details', request_id=request['id']) }}">
        Cancel
    </a>

</body>

</html>
