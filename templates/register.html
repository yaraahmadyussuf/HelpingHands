{% extends "base.html" %}

{% block title %}Register — Helping Hands{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="hh-card p-4 p-md-5">
            <h1 class="h3 mb-1">Create an account</h1>
            <p class="text-muted mb-4">Join Helping Hands as a requester or a donor.</p>

            <form method="POST">

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone">
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label">I am a...</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="requester">Requester — I need help</option>
                        <option value="donor">Donor — I want to help</option>
                    </select>
                    <div class="form-text">
                        Admin accounts aren't created from this form — they're managed separately.
                    </div>
                </div>

                <button type="submit" class="btn btn-hh-primary w-100">Create Account</button>

            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Already have an account?
                <a href="{{ url_for('auth.login') }}">Login here</a>
            </p>
        </div>

    </div>
</div>

{% endblock %}
