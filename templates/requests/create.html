{% extends "base.html" %}

{% block title %}Create a Help Request — Helping Hands{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

        <div class="hh-card p-4 p-md-5">
            <h1 class="h3 mb-1">Create a Help Request</h1>
            <p class="text-muted mb-4">Tell donors what you need — be as clear as you can.</p>

            <form method="POST">

                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                </div>

                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="">Select a category</option>
                            <option value="Education">Education</option>
                            <option value="Medical">Medical</option>
                            <option value="Food">Food</option>
                            <option value="Housing">Housing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-sm-6 mb-4">
                        <label for="amount_needed" class="form-label">Amount Needed (EGP)</label>
                        <input type="number" class="form-control" id="amount_needed" name="amount_needed" min="0.01" step="0.01" required>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-hh-primary">Submit Request</button>
                    <a href="{{ url_for('requests.list_requests') }}" class="btn btn-outline-hh">Cancel</a>
                </div>

            </form>
        </div>

    </div>
</div>

{% endblock %}
