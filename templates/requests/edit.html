{% extends "base.html" %}

{% block title %}Edit Request — Helping Hands{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

        <div class="hh-card p-4 p-md-5">
            <h1 class="h3 mb-1">Edit Help Request</h1>
            <p class="text-muted mb-4">Update your request's details.</p>

            <form method="POST">

                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ request['title'] }}">
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="5">{{ request['description'] }}</textarea>
                </div>

                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category">
                            <option value="Education" {% if request['category'] == 'Education' %}selected{% endif %}>Education</option>
                            <option value="Medical" {% if request['category'] == 'Medical' %}selected{% endif %}>Medical</option>
                            <option value="Food" {% if request['category'] == 'Food' %}selected{% endif %}>Food</option>
                            <option value="Housing" {% if request['category'] == 'Housing' %}selected{% endif %}>Housing</option>
                            <option value="Other" {% if request['category'] == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    <div class="col-sm-6 mb-4">
                        <label for="amount_needed" class="form-label">Amount Needed (EGP)</label>
                        <input type="number" class="form-control" id="amount_needed" name="amount_needed" value="{{ request['amount_needed'] }}" min="0" step="0.01">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-hh-primary">Save Changes</button>
                    <a href="{{ url_for('requests.request_details', request_id=request['id']) }}" class="btn btn-outline-hh">Cancel</a>
                </div>

            </form>
        </div>

    </div>
</div>

{% endblock %}
