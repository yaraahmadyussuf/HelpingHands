{% extends "base.html" %}

{% block title %}Page Not Found — 404{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="hh-card p-4 p-md-5 text-center">
            <div class="mb-3" style="font-size: 3.5rem; line-height: 1;">🤝</div>

            <h1 class="display-4 fw-bold mb-2" style="color: var(--hh-primary-dark); font-family: var(--hh-font-display);">404</h1>
            <h3 class="h4 mb-3">Oops! We couldn't find that page.</h3>
            <p class="text-muted mb-4">
                The link may be broken, or the page may have been moved or removed.
            </p>

            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <a href="{{ url_for('auth.home') }}" class="btn btn-hh-primary">
                    Back to Homepage
                </a>
                <a href="{{ url_for('requests.list_requests') }}" class="btn btn-outline-hh">
                    Browse Requests
                </a>
            </div>
        </div>

    </div>
</div>

{% endblock %}
