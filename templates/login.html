{% extends "base.html" %}

{% block title %}Login — Helping Hands{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <div class="hh-card p-4 p-md-5">
            <h1 class="h3 mb-1">Welcome back</h1>
            <p class="text-muted mb-4">Log in to your Helping Hands account.</p>

            <form method="POST">

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-hh-primary w-100">Login</button>

            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">Register here</a>
            </p>
        </div>

    </div>
</div>

{% endblock %}
